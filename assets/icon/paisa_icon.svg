<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    Paisa app icon: the wallet mark on the deep-green rounded square.
    Source of the launcher PNGs (legacy icons, Play-store 512 px, desktop).
    The wordmark and tagline from the brand artwork are left out on purpose:
    at launcher size (48 dp) they are unreadable and launcher masks crop them.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E6E4C"/>
      <stop offset="1" stop-color="#044A33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#BFE6A0"/>
      <stop offset="1" stop-color="#5DBB63"/>
    </linearGradient>
    <linearGradient id="wallet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7FBF7"/>
      <stop offset="1" stop-color="#E4F2E7"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2FAE76"/>
      <stop offset="1" stop-color="#0E7A4F"/>
    </linearGradient>
    <linearGradient id="tab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A8A5C"/>
      <stop offset="1" stop-color="#0B5E3F"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="224" fill="url(#glow)"/>
  <g transform="translate(512 512) scale(1.10) translate(-629 -470)">
    <!-- light green card tucked behind the receipt -->
    <rect x="640" y="258" width="168" height="150" rx="26" fill="url(#card)" transform="rotate(6 724 333)"/>
    <!-- receipt -->
    <g transform="rotate(-9 582 330)">
      <rect x="452" y="228" width="262" height="214" rx="30" fill="#FFFFFF"/>
      <rect x="494" y="282" width="168" height="22" rx="11" fill="#2E9B6B"/>
      <rect x="494" y="326" width="186" height="22" rx="11" fill="#2E9B6B"/>
      <rect x="494" y="370" width="120" height="22" rx="11" fill="#2E9B6B"/>
    </g>
    <!-- wallet body, with the green lining showing at the opening -->
    <path d="M430 382 Q398 382 398 420 L398 640 Q398 715 470 715 L752 715 Q822 715 822 645 L822 450 Q822 380 752 380 L470 380 Z" fill="url(#wallet)"/>
    <path d="M400 418 Q404 384 446 380 L520 380 Q470 396 452 430 Z" fill="#1B8A5A"/>
    <!-- clasp tab -->
    <rect x="712" y="486" width="150" height="122" rx="52" fill="url(#tab)"/>
    <circle cx="772" cy="547" r="24" fill="#F7FBF7"/>
    <!-- growth bars -->
    <rect x="456" y="580" width="58" height="92" rx="14" fill="url(#bar)"/>
    <rect x="530" y="546" width="60" height="126" rx="14" fill="url(#bar)"/>
    <rect x="606" y="492" width="62" height="180" rx="14" fill="url(#bar)"/>
  </g>
</svg>
